name: Sync English Mastery Hotfix 12.4.7.1

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/enmastery1247-fixed.tar.xz"

permissions:
  contents: write

concurrency:
  group: enmastery-source-sync
  cancel-in-progress: false

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract verified release source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/enmastery1247
          mkdir -p /tmp/enmastery1247
          tar -xJf .bootstrap/enmastery1247-fixed.tar.xz -C /tmp/enmastery1247
          test -f /tmp/enmastery1247/englist_mastery/package.json
          test -f /tmp/enmastery1247/englist_mastery/V1_0_2_HOTFIX12_4_7_1_RELEASE.md
          grep -q '"version": "1.0.2"' /tmp/enmastery1247/englist_mastery/package.json

      - name: Replace repository with release source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=".git/" /tmp/enmastery1247/englist_mastery/ ./
          test ! -e .bootstrap/enmastery1247-fixed.tar.xz
          test -f V1_0_2_HOTFIX12_4_7_1_RELEASE.md

      - name: Commit source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "English Mastery v1.0.2 hotfix12.4.7.1: admin Worker optimization + typecheck fix"
          git push origin HEAD:main
